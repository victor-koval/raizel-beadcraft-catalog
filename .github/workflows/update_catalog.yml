name: Update & Validate Preciosa Catalog

on:
  schedule:
    # Запуск щомісяця 1-го числа о 03:00 UTC
    - cron: '0 3 1 * *'
  workflow_dispatch:
    # Ручний запуск через кнопку в GitHub Actions
  push:
    paths:
      - 'scripts/**'
      - 'preciosa_palette.json'
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  sync_and_validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Catalog Sync & Validation
        run: |
          python scripts/sync_suppliers.py

      - name: Commit & Push changes (if any)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain) ]]; then
            echo "Changes detected in catalog. Committing and pushing..."
            git add preciosa_palette.json README.md
            git commit -m "chore(catalog): auto-update and validate Preciosa palette [skip ci]"
            git push origin HEAD
            # Тримаємо обидві гілки (main та master) синхронізованими
            if [[ "${{ github.ref_name }}" == "master" ]]; then
              git push origin HEAD:main
            elif [[ "${{ github.ref_name }}" == "main" ]]; then
              git push origin HEAD:master
            fi
          else
            echo "No changes in catalog. Everything is up to date."
          fi
